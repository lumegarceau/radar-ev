name: Descubrir valueodds
on:
  workflow_dispatch:
  push:
    paths: ["d.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Descubrir
        run: python descubrir.py
