name: Descubrir valueodds
on:
  workflow_dispatch:
  push:
    paths: ["d.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install "python-socketio[client]" websocket-client
      - name: Descubrir
        run: python descubrir.py
