name: Sonda Betinia 2
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonda
        run: python sonda39.py
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
