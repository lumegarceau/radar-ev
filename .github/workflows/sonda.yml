name: Sonda MLS
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install playwright "python-socketio[client]" websocket-client
          playwright install --with-deps chromium
      - name: Sonda
        run: python sonda.py
