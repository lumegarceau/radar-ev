name: Cuotas Sportium y Marca
on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
    - cron: "20 10 * * *"
    - cron: "20 13 * * *"
    - cron: "20 18 * * *"
permissions:
  contents: write
concurrency:
  group: sportium
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Leer cuotas de Sportium y Marca
        run: python sportium.py
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sportium.json marca.json
          git commit -m "sportium" || echo "sin cambios"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
