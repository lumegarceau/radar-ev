name: Actualizar Radar EV

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright y navegador invisible
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Ejecutar el robot
        env:
          VALUESTATS_USER: ${{ secrets.VALUESTATS_USER }}
          VALUESTATS_PASSWORD: ${{ secrets.VALUESTATS_PASSWORD }}
        run: |
          python actualizar.py

      - name: Guardar los datos en tu GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add radar-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización de Radar EV" && git push)
