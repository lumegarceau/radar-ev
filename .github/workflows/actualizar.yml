name: Actualizar Radar EV

on:
  schedule:
    # 07:00 UTC = 08:00 Madrid (Invierno)
    # 19:00 UTC = 20:00 Madrid (Invierno)
    - cron: '0 7,19 * * *'
  workflow_dispatch: # Te permite darle a un botón para ejecutarlo a mano cuando quieras

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Pipeline
        run: |
          python3 pipeline-diario.py

      - name: Guardar y publicar cambios
        run: |
          git config --global user.name "Radar EV Bot"
          git config --global user.email "bot@radarev.local"
          git add radar-data.json
          git commit -m "Actualización automática de cuotas [skip ci]" || echo "Sin cambios"
          git push
