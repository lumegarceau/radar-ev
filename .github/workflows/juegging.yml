name: Cuotas Juegging (Kirolbet)
on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"
    - cron: "40 10 * * *"
    - cron: "40 14 * * *"
    - cron: "40 18 * * *"
permissions:
  contents: write
concurrency:
  group: juegging
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Leer cuotas de Juegging
        run: python juegging.py
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add juegging.json
          git commit -m "juegging" || echo "sin cambios"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
