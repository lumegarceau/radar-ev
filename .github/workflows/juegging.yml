name: Cuotas Juegging (Kirolbet)
on:
  workflow_dispatch:
  # PAUSADO (24/11): Akamai devuelve 403 a las IP de GitHub y del proxy.
  # Para reactivar, restaurar el bloque schedule (cron 15 22, 5, 8, 12, 15, 18 y 20).
permissions:
  contents: write
concurrency:
  group: juegging
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          pip install playwright
          playwright install chromium
          timeout 120 playwright install-deps chromium || echo "dependencias del sistema: se sigue sin ellas"
      - name: Leer cuotas de Juegging
        run: python juegging.py
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add juegging.json
          git commit -m "juegging" || echo "sin cambios"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
