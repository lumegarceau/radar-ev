name: Corregir resultados
on:
  workflow_dispatch:
  push:
    paths: ["c.txt"]
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
permissions:
  contents: write
concurrency:
  group: radar
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corregir
        run: python resultados.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "resultados" || echo "sin cambios"
          git pull --rebase
          git push
