name: Probar OddsPapi
on:
  workflow_dispatch:
  push:
    paths: ["op.txt"]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar
        run: python prueba_oddspapi.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
