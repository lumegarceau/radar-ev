name: Radar diario
on:
  workflow_dispatch:
  push:
    paths: ["go.txt"]
  schedule:
    # 00, 07, 10, 14, 17, 20 y 22 h (Madrid en invierno = UTC+1)
    - cron: "0 23 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"
permissions:
  contents: write
concurrency:
  group: radar
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install "python-socketio[client]" websocket-client
      - name: Calcular radar
        run: python radar.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LIMITE: "4200"
      - name: Props de jugadores
        run: python props.py
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LIMITE: "3000"
      - name: Arbitros
        run: python arbitros.py
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LIMITE: "1500"
      - name: Guardar historial
        run: python guardar.py
        continue-on-error: true
      - name: Avisar de errores de cuota
        run: python notificar.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -r -q --cached __pycache__ || true
          git add -A
          git commit -m "radar" || echo "sin cambios"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
# fin
