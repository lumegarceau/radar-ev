name: Radar diario
on:
  workflow_dispatch:
  push:
    paths: ["go.txt"]
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
permissions:
  contents: write
concurrency:
  group: radar
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install "python-socketio[client]" websocket-client
      - name: Calcular radar
        run: python radar.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LIMITE: "4200"
      - name: Props de jugadores
        run: python props.py
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LIMITE: "3000"
      - name: Guardar datos
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "radar" || echo "sin cambios"
          git pull --rebase
          git push
