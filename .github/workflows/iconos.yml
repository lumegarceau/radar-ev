name: Crear iconos
on:
  workflow_dispatch:
  push:
    paths: ["i.txt"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install pillow
      - name: Crear
        run: python iconos.py
      - name: Guardar
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add icon-*.png
          git commit -m "iconos" || echo "sin cambios"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort || true
            sleep 5
          done
          exit 1
